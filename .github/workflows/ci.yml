name: CI - Build & Push AI API 
# Workflow để build và đẩy image AI API lên Docker Hub khi có thay đổi trên nhánh main 

on: # Kích hoạt workflow khi có push lên nhánh main
  push: # Đẩy code lên nhánh main -> kích hoạt workflow
    branches: # Chỉ theo dõi nhánh main
      - main 

jobs:  # Định nghĩa các job trong workflow
  build-and-push: # Tên job 
    runs-on: ubuntu-latest   # Chạy job trên máy ảo Ubuntu mới nhất

    steps: # Định nghĩa các bước trong job
      # 1️⃣ Checkout code
      - name: Checkout code   # Bước đầu tiên: kiểm tra mã nguồn
        uses: actions/checkout@v4   # Sử dụng action chính thức để checkout code từ repo

      # 2️⃣ Login Docker Hub  -> push image ko bị access denied
      - name: Login to Docker Hub
        uses: docker/login-action@v3  # Sử dụng action chính thức để đăng nhập Docker Hub
        with: # Cung cấp thông tin đăng nhập từ secrets
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & push image
      - name: Build and push Docker image # Bước xây dựng và đẩy image Docker
        uses: docker/build-push-action@v5  
        # Sử dụng action chính thức để build, tag và push image Docker 
        with:
          context: ./ai-api  # Đường dẫn đến thư mục chứa Dockerfile của AI API
          push: true  # Bật tính năng đẩy image lên Docker Hub
          tags: | # Định nghĩa thẻ (tags) cho image
            ${{ secrets.DOCKER_USERNAME }}/ai-api:${{ github.sha }} 
            ${{ secrets.DOCKER_USERNAME }}/ai-api:latest